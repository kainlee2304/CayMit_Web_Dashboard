services:
  # Backend FastAPI Web Service
  - type: web
    name: caymit-backend
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install --no-cache-dir -r tammysmartfruit/backend/requirements.txt"
    startCommand: "cd tammysmartfruit/backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_ENV
        value: production
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: caymit-postgres
          property: connectionString
      - key: TRACEABILITY_TOKEN_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: TRUSTED_HOSTS
        value: "*"
      - key: PYTHON_VERSION
        value: 3.11.9

databases:
  # Managed PostgreSQL Database
  - name: caymit-postgres
    region: singapore
    plan: free
    databaseName: caymit
    user: caymit
