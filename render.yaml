services:
  # Backend FastAPI Web Service
  - type: web
    name: caymit-backend
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: caymit-postgres
          property: connectionString
      - key: TRACEABILITY_TOKEN_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: TRUSTED_HOSTS
        value: "*"

databases:
  # Managed PostgreSQL Database
  - name: caymit-postgres
    region: singapore
    plan: free
    databaseName: caymit
    user: caymit
